name: Auto-Update Asset Links in README

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan All Folders & Update README.md
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import urllib.parse

          owner = os.environ["REPO_OWNER"]
          repo = os.environ["REPO_NAME"]
          branch = os.environ["BRANCH"]

          ignore_dirs = {".git", ".github"}
          ignore_files = {"README.md", ".gitignore", ".gitattributes", ".DS_Store"}

          categories = {
              "🎯 Icons & Logos": [],
              "🖼️ Images & UI Graphics": [],
              "🎨 Backgrounds & Wallpapers": [],
              "🎬 Videos & Animations": [],
              "📦 Software, Libraries & Other Files": [],
          }

          image_exts = {".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"}
          icon_exts = {".svg", ".ico", ".icns"}
          video_exts = {".mp4", ".webm", ".mov", ".avi", ".mkv", ".lottie"}
          preview_exts = image_exts | icon_exts

          for root, dirs, files in os.walk("."):
              dirs[:] = sorted(d for d in dirs if d not in ignore_dirs)
              for fname in sorted(files):
                  if fname in ignore_files:
                      continue
                  full_path = os.path.join(root, fname)
                  rel_path = os.path.relpath(full_path, ".").replace("\\", "/")
                  ext = os.path.splitext(fname)[1].lower()
                  lower_path = rel_path.lower()

                  if any(k in lower_path for k in ("background", "wallpaper", "bg-", "bg_")) and ext in preview_exts:
                      categories["🎨 Backgrounds & Wallpapers"].append(rel_path)
                  elif ext in icon_exts or (any(k in lower_path for k in ("icon", "logo")) and ext in image_exts):
                      categories["🎯 Icons & Logos"].append(rel_path)
                  elif ext in image_exts:
                      categories["🖼️ Images & UI Graphics"].append(rel_path)
                  elif ext in video_exts:
                      categories["🎬 Videos & Animations"].append(rel_path)
                  else:
                      categories["📦 Software, Libraries & Other Files"].append(rel_path)

          lines = []
          total_files = 0

          for cat, items in categories.items():
              if not items:
                  continue
              total_files += len(items)
              lines.append(f"### {cat}\n")
              lines.append("| Name & Path | Preview | CDN Link (`jsDelivr`) | Direct Raw |")
              lines.append("| :--- | :---: | :--- | :---: |")
              for path in items:
                  encoded = "/".join(urllib.parse.quote(p) for p in path.split("/"))
                  cdn_url = f"https://cdn.jsdelivr.net/gh/{owner}/{repo}@{branch}/{encoded}"
                  raw_url = f"https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{encoded}"
                  ext = os.path.splitext(path)[1].lower()
                  preview = f'<img src="{raw_url}" width="36" />' if ext in preview_exts else "—"
                  lines.append(f"| `{path}` | {preview} | `{cdn_url}` | [Raw]({raw_url}) |")
              lines.append("")

          print(f"Detected {total_files} asset files.")
          generated_md = "\n".join(lines).strip() if lines else "*No assets uploaded yet.*"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- ASSETS-START -->.*?<!-- ASSETS-END -->"
          if not re.search(pattern, readme, flags=re.DOTALL):
              raise RuntimeError("Missing <!-- ASSETS-START --> or <!-- ASSETS-END --> markers in README.md")

          replacement = f"<!-- ASSETS-START -->\n{generated_md}\n<!-- ASSETS-END -->"
          updated = re.sub(pattern, lambda _: replacement, readme, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          EOF

      - name: Commit & Push Updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update asset links in README.md [skip ci]"
          git push
